[project]
name = "agentic-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Abhrxdi4p Pal", email = "abhradip65@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.4.0",
    "langchain>=1.5.2",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.5.2",
    "langchain-groq>=1.2.1",
    "langchain-openai>=1.8.5",
    "langgraph>=1.2.24",
    "langsmith>=0.16.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
agentic-ai = "agentic_ai:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"
